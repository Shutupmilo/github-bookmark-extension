<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>GitHub Bookmark Saver</title><style>
body{width:380px;margin:0;padding:16px;background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h1{margin:0 0 12px;font-size:18px;color:#58a6ff}.field{margin-bottom:12px}label{display:block;margin-bottom:5px;font-size:12px;color:#8b949e;font-weight:600}input,textarea{width:100%;box-sizing:border-box;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#c9d1d9;padding:8px 10px;font-size:12px}textarea{min-height:70px;resize:vertical}button{width:100%;border:0;background:#238636;color:#fff;border-radius:6px;padding:10px;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.status{display:none;margin-top:12px;padding:8px 10px;border-radius:6px;font-size:12px}.status.visible{display:block}.success{background:rgba(35,134,54,.15);color:#3fb950}.error{background:rgba(248,81,73,.12);color:#f85149}.info{background:rgba(88,166,255,.12);color:#58a6ff}.link-row{margin-top:12px;text-align:center}.link-row a{color:#58a6ff;text-decoration:none;font-size:12px}
</style></head><body><h1>Save bookmark</h1><div class="field"><label for="pageTitle">Title</label><input id="pageTitle"></div><div class="field"><label for="pageUrl">URL</label><input id="pageUrl" readonly></div><div class="field"><label for="pagePath">Path</label><input id="pagePath" readonly></div><div class="field"><label for="pageDescription">Description</label><textarea id="pageDescription" placeholder="Optional summary"></textarea></div><div class="field"><label for="pageTags">Tags</label><input id="pageTags" placeholder="comma,separated,tags"></div><div class="field"><label for="pageNotes">Notes</label><textarea id="pageNotes" placeholder="Optional notes"></textarea></div><button id="saveButton">Save bookmark</button><div id="status" class="status"></div><div class="link-row"><a href="#" id="settingsLink">Open settings</a></div><script src="popup.js"></script></body></html>
